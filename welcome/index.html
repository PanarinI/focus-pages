<script>
// Салют: сыпется один раз при открытии страницы и исчезает. Палитра — тёплая, продуктовая:
// свет звезды из иконки и три цвета шума из панели (коричневый · розовый · белый).
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti'); if (!cv) return;
  const x = cv.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  function size() { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; x.setTransform(dpr,0,0,dpr,0,0); }
  size(); addEventListener('resize', size);
  const COLORS = ['#fff5e6','#ffd9a0','#ffb866','#ffb055','#c98c4c','#c28b9b','#e6e2dc'];
  const P = [];
  for (let i = 0; i < 130; i++) P.push({
    x: Math.random() * innerWidth, y: -20 - Math.random() * 340,
    w: 7 + Math.random() * 8, h: 3.5 + Math.random() * 5,
    c: COLORS[(Math.random() * COLORS.length) | 0],
    a: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 0.18,
    vx: (Math.random() - 0.5) * 2.6, vy: 2.4 + Math.random() * 3.4,
    o: 1, delay: Math.random() * 60,
  });
  let f = 0;
  (function draw() {
    x.clearRect(0, 0, innerWidth, innerHeight);
    let alive = 0;
    for (const p of P) {
      if (f < p.delay) { alive++; continue; }
      p.x += p.vx; p.y += p.vy; p.vy += 0.07; p.a += p.spin;
      if (p.y > innerHeight * 0.8) p.o -= 0.032;
      if (p.o <= 0) continue;
      alive++;
      x.save(); x.globalAlpha = Math.max(0, p.o);
      x.translate(p.x, p.y); x.rotate(p.a);
      x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      x.restore();
    }
    f++;
    if (alive > 0 || f < 80) requestAnimationFrame(draw);
    else { x.clearRect(0, 0, innerWidth, innerHeight); cv.remove(); }
  })();
})();
</script>
