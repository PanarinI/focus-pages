<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brown Noise Generator — what went wrong?</title>
<style>
  /* Страница после оценки 1–3 в расширении — тот же один вопрос, что после удаления, чем проще, тем больше ответов (5–15 %).
     Главное на странице — сам вопрос (слово автора 28.09: «нужно, чтобы главным был вопрос what went wrong?»).
     Интерфейса Google Forms на странице нет: своё поле шлёт ответ прямо в ту же форму (formResponse) —
     ответы ложатся в ту же таблицу. Палитра — welcome 1.2: тёплое почти-чёрное поле, свет звезды.
     Карточка — наклейка: светлая, обводка цветом шкалы из иконки, жёсткая тень янтарём. */
  :root{ --bg:#231911; --bg2:#0a0908; --warm:#ffb055; --ink:#efe6da; --ink-dim:#a39585;
         --paper:#f6eee3; --rim:#433a32; --brown:#231911; }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  /* холст страницы — тёмный: иначе фон body повторяется под контентом и даёт светлую полосу внизу */
  html{background:var(--bg2)}
  body{
    background:radial-gradient(130% 90% at 50% 0%, var(--bg) 0%, var(--bg2) 66%);
    color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(28px,6vh,64px) 20px 56px;
  }
  .kicker{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:0 0 10px; font-size:15px; color:var(--ink-dim); text-align:center;
  }
  /* иконка продукта — видно, о чём речь */
  .kicker svg{flex:none; transform:rotate(-8deg); }
  h1{
    margin:0 0 clamp(22px,4vh,34px); text-align:center;
    font-size:clamp(36px,6.4vw,58px); line-height:1.08; font-weight:700; letter-spacing:-.025em;
  }
  .sticker{ width:100%; max-width:560px; transform:rotate(-.5deg); }
  .card{
    background:var(--paper); color:var(--brown);
    border:3px solid var(--rim); border-radius:20px; box-shadow:7px 7px 0 var(--warm);
    padding:18px;
  }
  textarea{
    display:block; width:100%; min-height:128px; resize:vertical; margin:0;
    font-family:inherit; font-size:18px; line-height:1.5; color:var(--brown); background:#fffaf2;
    border:2px solid #d9cbb8; border-radius:12px; padding:14px 16px;
  }
  textarea::placeholder{color:#766858}
  textarea:focus{outline:none; border-color:var(--brown); box-shadow:0 0 0 3px rgba(255,176,85,.45)}
  .row{display:flex; justify-content:flex-end; margin-top:14px}
  button{
    font-family:inherit; font-weight:700; font-size:17px; line-height:1; color:var(--brown); background:var(--warm);
    border:3px solid var(--brown); border-radius:12px; padding:12px 28px; cursor:pointer;
    box-shadow:4px 4px 0 var(--brown); transition:transform .06s, box-shadow .06s;
  }
  button:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--brown)}
  button:focus-visible{outline:3px solid var(--brown); outline-offset:3px}
  button[aria-disabled="true"]{opacity:.7; cursor:progress}
  .done:focus{outline:none}
  button:disabled{opacity:.4; cursor:default; box-shadow:none; transform:none}
  .done{padding:30px 10px; text-align:center; font-size:20px; font-weight:700}
  .failed{margin:18px 0 0; font-size:15px; color:var(--ink-dim); text-align:center; max-width:46ch}
  .failed a, .back a{color:var(--warm); text-decoration:none; font-weight:600}
  .failed a:hover, .back a:hover{text-decoration:underline}
  /* узкий телефон: иконка над строкой над вопросом */
  @media (max-width:420px){ .kicker{flex-direction:column; gap:6px} }
  .back{margin-top:30px; font-size:14px; color:var(--ink-dim); text-align:center}
</style>
</head>
<body>

  <!-- ИКОНКА РАСШИРЕНИЯ — «шкала и звезда» (1.2). Не рисуется по памяти: перенесена один в один с welcome,
       а туда — из мастера `sound-focus-timer/lab/graphics/icon-2026-09-26-b-dajl.svg`. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="ic-pole" cx="64" cy="48" r="96" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#231911"/><stop offset=".5" stop-color="#100d0b"/><stop offset="1" stop-color="#0a0908"/>
      </radialGradient>
      <radialGradient id="ic-oreol" cx="64" cy="46" r="32" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffb055" stop-opacity=".62"/><stop offset=".45" stop-color="#ffb055" stop-opacity=".2"/><stop offset="1" stop-color="#ffb055" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="ic-zvezda" cx="64" cy="46" r="11.5" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff5e6"/><stop offset=".55" stop-color="#ffd9a0"/><stop offset="1" stop-color="#ffb866"/>
      </radialGradient>
      <g id="ext-icon">
        <rect width="128" height="128" rx="22" fill="url(#ic-pole)"/>
        <path d="M 22 88 A 42 42 0 0 1 106 88" fill="none" stroke="#433a32" stroke-width="11" stroke-linecap="round"/>
        <path d="M 22 88 A 42 42 0 0 1 64 46" fill="none" stroke="#ffb055" stroke-width="11" stroke-linecap="round"/>
        <circle cx="64" cy="46" r="32" fill="url(#ic-oreol)"/>
        <circle cx="64" cy="46" r="11.5" fill="url(#ic-zvezda)"/>
      </g>
    </defs>
  </svg>

  <p class="kicker">
    <svg width="28" height="28" viewBox="0 0 128 128" aria-hidden="true"><use href="#ext-icon"/></svg>
    Sorry about that.
  </p>
  <h1 id="q">What went wrong?</h1>

  <div class="sticker"><div class="card">
    <form id="ask">
      <textarea id="answer" aria-labelledby="q" placeholder="One line is enough" maxlength="3000" autofocus></textarea>
      <div class="row"><button type="submit" id="send">Send</button></div>
    </form>
    <div class="done" id="done" role="status" tabindex="-1" hidden>Thank you — we got it.</div>
  </div></div>

  <p class="failed" id="failed" role="alert" hidden>
    It didn’t go through. <a id="mail" href="#">Send it by email instead</a> — your text is already filled in.
  </p>


  <script>
    // Ответ уходит в Google-форму автора напрямую (formResponse) — те же ответы, та же таблица, без интерфейса формы.
    // ENTRY — номер поля «What went wrong?» в этой форме; сверен 28.09 подстановкой (viewform?usp=pp_url&entry.…).
    // Правка вопроса в Google Forms может сменить номер — тогда сверить заново.
    // no-cors: ответа Google страница не видит; сеть не ответила — предлагаем письмо с уже вписанным текстом.
    const FORM_ID   = '1FAIpQLSfTyBVwYzmT3Pvhj0xsmcgE3OzKnR5qCjEeR6HOLIU5msrwkg';
    const ENTRY     = 'entry.1959995510';
    // откуда ответ — пометкой в начале того же ответа: «[uninstall] …» / «[rating 2★] …» (одна таблица на продукт;
    // второго вопроса в форме нет — слово автора 28.09)
    // звёзды приходят из расширения: …/feedback?stars=2
    const STARS     = +new URLSearchParams(location.search).get('stars');
    const SOURCE    = STARS >= 1 && STARS <= 5 ? `rating ${STARS}★` : 'rating';
    const EMAIL     = 'hello@fanarlabs.com';   // публично — только адрес бренда (garden-meta/POCHTY.md); вход CWS не светить
    const SUBJECT   = 'Why I removed Brown Noise Generator';

    const form = document.getElementById('ask'), ta = document.getElementById('answer'), send = document.getElementById('send');
    let sending = false;
    // Enter — отправить (ответ в одну строку, как в чате); Shift+Enter — новая строка
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
    });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const text = ta.value.trim();
      if (sending) return;
      // поле не обязательное (слово автора 03.10): пустой Send — тоже ответ, уходит одна пометка «[rating N★]» — сама оценка
      // пока идёт отправка: поле только для чтения (иначе правка молча не уйдёт), кнопка не гаснет через disabled —
      // иначе фокус с неё падает на body; повтор держит флаг sending
      sending = true; ta.readOnly = true; send.setAttribute('aria-disabled', 'true'); send.textContent = 'Sending…';
      document.getElementById('failed').hidden = true;
      const body = new URLSearchParams({ [ENTRY]: text ? `[${SOURCE}] ${text}` : `[${SOURCE}]`, fvv: '1', pageHistory: '0' });
      try {
        // keepalive — ответ дойдёт, даже если вкладку закрыли во время отправки;
        // таймаут — зависшая сеть через 10 с уходит в запасной путь письмом, а не держит «Sending…» минуту
        await fetch(`https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`,
          { method: 'POST', mode: 'no-cors', body, keepalive: true, signal: AbortSignal.timeout(10000) });
        form.hidden = true;
        const done = document.getElementById('done');
        done.hidden = false; done.focus();
      } catch (err) {
        document.getElementById('failed').hidden = false;
        ta.readOnly = false; send.removeAttribute('aria-disabled'); send.textContent = 'Send'; sending = false;
      }
    });
    // письмо собирается в момент щелчка — из того, что в поле сейчас
    document.getElementById('mail').addEventListener('click', e => {
      e.currentTarget.href = `mailto:${EMAIL}?subject=${encodeURIComponent(SUBJECT)}&body=${encodeURIComponent(ta.value.trim())}`;
    });
  </script>
</body>
</html>
